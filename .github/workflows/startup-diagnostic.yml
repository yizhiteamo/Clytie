name: One Windows startup diagnostic

'on':
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a43-startup-diagnostic-once
  cancel-in-progress: false

jobs:
  windows_startup_diagnostic:
    if: >-
      github.repository == 'yizhiteamo/Clytie' &&
      github.ref == 'refs/heads/main' &&
      github.run_number == 2 && github.run_attempt == 1
    runs-on: windows-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      CLYTIE_STARTUP_DIAGNOSTIC: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7b865241f95be973530eda5106bacd620c6e1b1d
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.10'
      - name: Install locked tooling
        run: |
          python -m pip install uv==0.9.5
          uv sync --locked
      - name: Verify exact test candidate
        run: >-
          python -c "import subprocess;
          expected='7b865241f95be973530eda5106bacd620c6e1b1d';
          actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();
          assert actual==expected;
          assert not subprocess.check_output(['git','diff','--name-only']);
          print('startup_diagnostic_candidate='+actual)"
      - name: One targeted diagnostic invocation
        run: >-
          uv run --no-sync python -m scripts.startup_diagnostic
