name: A4.3 fixed closeout linux
'on':
  pull_request:
    types: [synchronize]
    paths: [.github/a43-closeout-linux-request.json]
permissions:
  contents: read
jobs:
  closeout_linux:
    if: github.repository == 'yizhiteamo/Clytie' && github.event.pull_request.number == 71 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read fixed request without starting a scene
        id: request
        shell: bash
        run: |
          python -c "import json,os,pathlib,re; assert os.environ['GITHUB_RUN_ATTEMPT']=='1'; p=pathlib.Path('.github/a43-closeout-linux-request.json'); r=json.loads(p.read_bytes()); t=r['tool']; assert re.fullmatch('[a-f0-9]{40}',t); q=pathlib.Path(os.environ['RUNNER_TEMP'])/'closeout-request.json'; q.open('xb').write(p.read_bytes()); pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a').write('tool='+t+'\n')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.request.outputs.tool }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.10'
      - name: Locked tool environment
        shell: bash
        run: |
          python -m pip install uv==0.9.5
          uv sync --locked
      - name: One fixed scene and encrypted evidence
        id: scene
        shell: bash
        run: uv run --no-sync python -B -m scripts.measurement_closeout
      - name: Preserve only validated ciphertext even on scene failure
        if: always() && steps.scene.outputs.ciphertext != '' && steps.scene.outputs.receipt != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a43-closeout-linux-${{ github.run_id }}
          path: |
            ${{ steps.scene.outputs.ciphertext }}
            ${{ steps.scene.outputs.receipt }}
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: false
