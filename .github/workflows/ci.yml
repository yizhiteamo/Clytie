name: CI

on:
  pull_request:
  push:
    branches: [a1-sdk]

permissions:
  contents: read

jobs:
  offline:
    name: offline (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked development environment
        run: |
          python -m pip install uv==0.9.5
          uv sync --locked
      - name: Public content scan
        run: uv run --no-sync pre-commit run check-public-files --all-files
      - name: Ruff
        run: uv run --no-sync ruff check .
      - name: Format
        run: uv run --no-sync ruff format --check .
      - name: SDK boundary and clock checks
        run: uv run --no-sync python scripts/check_architecture.py
      - name: Official plugin catalog
        run: uv run --no-sync python scripts/build_catalog.py --check
      - name: Supervisor subprocess smoke
        run: uv run --no-sync pytest tests/test_supervisor_smoke.py
      - name: API and management subprocess smoke
        run: uv run --no-sync pytest tests/test_api_smoke.py tests/test_api_startup_read.py tests/test_management_journal.py tests/test_management_workers.py tests/test_management_start_integration.py tests/test_management_http_integration.py -k "real_ or parent_loss or restart_verification"
      - name: Offline tests
        run: uv run --no-sync pytest
      - name: Fictional backup performance (text, database, asset)
        run: uv run --no-sync python scripts/benchmark_backup.py --output .cache/backup-performance/standard --scales small_text large_database large_asset --requests 800 --interval 0.025 --conditions-note "CI runner; sequential after offline tests; unrelated host load unknown"
      - name: Fictional backup performance (small files)
        run: uv run --no-sync python scripts/benchmark_backup.py --output .cache/backup-performance/files --scales many_small_files --requests 4800 --interval 0.025 --conditions-note "CI runner; sequential after other performance cases; unrelated host load unknown"
      - name: Repeated large-database latency diagnostics
        run: uv run --no-sync python scripts/benchmark_backup.py --output .cache/backup-performance/repeated --scales large_database --requests 800 --interval 0.025 --repeats 3 --conditions-note "CI runner; sequential after four scales; alternating baseline/backup order; no other task in this job; unrelated host load unknown"
      - name: Scan performance summaries
        run: |
          uv run --no-sync pre-commit run check-public-commit-message --hook-stage commit-msg --commit-msg-filename .cache/backup-performance/standard/summary.md
          uv run --no-sync pre-commit run check-public-commit-message --hook-stage commit-msg --commit-msg-filename .cache/backup-performance/files/summary.md
          uv run --no-sync pre-commit run check-public-commit-message --hook-stage commit-msg --commit-msg-filename .cache/backup-performance/repeated/summary.md
      - name: Preserve fictional performance summaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backup-performance-${{ matrix.os }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .cache/backup-performance/standard/summary.md
            .cache/backup-performance/files/summary.md
            .cache/backup-performance/repeated/summary.md
      - name: Validate fictional home
        run: uv run --no-sync python -m clytie status --home examples/home --json
      - name: Build wheel and source distribution
        run: uv build --no-sources --no-build-isolation
