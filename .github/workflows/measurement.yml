          name: a43-encrypted-${{ github.run_id }}-${{ github.run_attempt }}-windows-slot1
          path: |
            ${{ steps.slot1.outputs.ciphertext }}
            ${{ steps.slot1.outputs.receipt }}
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: false
      - name: Confirm uploaded encrypted pair before advancing
        if: ${{ success() && steps.slot1.outputs.ciphertext != '' }}
        shell: bash
        working-directory: execution
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload1.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload1.outputs.artifact-digest }}
        run: uv run --no-sync python -B -m scripts.measurement_mechanism_workflow confirm-upload --slot 1
      - name: Execute frozen platform slot 3 once and seal stable output
        if: ${{ success() && steps.prepare.outputs.ready == 'true' }}
