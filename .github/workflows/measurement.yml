name: A4.3 admitted mechanism

'on':
  pull_request:
    types: [synchronize]
    paths: [.github/a43-mechanism-request.json]

permissions:
  contents: read

# No dispatch, rerun allowance, concurrency-based deduplication or plaintext upload.
# The dependency follows the currently frozen Windows-then-Linux plan order.
jobs:
  mechanism_windows:
    if: >-
      github.repository == 'yizhiteamo/Clytie' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false
    runs-on: windows-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.10'
      - name: Install locked control environment
        shell: bash
        run: |
          python -m pip install uv==0.9.5
          uv sync --locked
      - name: Validate Q and wait for the fixed local admission B
        id: admitted
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync python -B -m scripts.measurement_mechanism_workflow wait
      - name: Checkout the explicitly admitted tool commit T
        if: ${{ success() && steps.admitted.outputs.eligible == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.admitted.outputs.tool_commit }}
          path: execution
          fetch-depth: 0
          persist-credentials: false
      - name: Install the fixed tool environment
        if: ${{ success() && steps.admitted.outputs.eligible == 'true' }}
        shell: bash
        working-directory: execution
        run: uv sync --locked
      - name: Import exact B objects and validate C T environment and frozen slots
        if: ${{ success() && steps.admitted.outputs.eligible == 'true' }}
        id: prepare
        shell: bash
        working-directory: execution
        env:
          GH_TOKEN: ${{ github.token }}
          ADMISSION_COMMIT: ${{ steps.admitted.outputs.admission_commit }}
        run: uv run --no-sync python -B -m scripts.measurement_mechanism_workflow prepare --admission-commit "$ADMISSION_COMMIT"
      - name: Execute frozen platform slot 1 once and seal stable output
        if: ${{ success() && steps.prepare.outputs.ready == 'true' }}
        id: slot0
        shell: bash
        working-directory: execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync python -B -m scripts.measurement_mechanism_workflow run-slot --slot 0
      - name: Preserve ciphertext even when the driver failed
        id: upload0
        if: ${{ always() && steps.slot0.outputs.ciphertext != '' && steps.slot0.outputs.receipt != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a43-encrypted-${{ github.run_id }}-${{ github.run_attempt }}-windows-slot0
          path: |
            ${{ steps.slot0.outputs.ciphertext }}
            ${{ steps.slot0.outputs.receipt }}
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: false
      - name: Confirm uploaded encrypted pair before advancing
        if: ${{ success() && steps.slot0.outputs.ciphertext != '' }}
        shell: bash
        working-directory: execution
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload0.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload0.outputs.artifact-digest }}
        run: uv run --no-sync python -B -m scripts.measurement_mechanism_workflow confirm-upload --slot 0
      - name: Execute frozen platform slot 2 once and seal stable output
        if: ${{ success() && steps.prepare.outputs.ready == 'true' }}
        id: slot1
        shell: bash
        working-directory: execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync python -B -m scripts.measurement_mechanism_workflow run-slot --slot 1
      - name: Preserve ciphertext even when the driver failed
        id: upload1
        if: ${{ always() && steps.slot1.outputs.ciphertext != '' && steps.slot1.outputs.receipt != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
