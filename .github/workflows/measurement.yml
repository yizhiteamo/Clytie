          ARTIFACT_DIGEST: ${{ steps.upload2.outputs.artifact-digest }}
        run: uv run --no-sync python -B -m scripts.measurement_mechanism_workflow confirm-upload --slot 2
      - name: Execute frozen platform slot 4 once and seal stable output
        if: ${{ success() && steps.prepare.outputs.ready == 'true' }}
