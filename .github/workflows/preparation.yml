name: A4.3 preparation metadata

# A separate request-only commit is required. This is not performance execution.
# No workflow_dispatch dependency: this workflow may first exist on the PR head.
'on':
  pull_request:
    types: [synchronize]
    paths: [.github/a43-preparation-request.json]

permissions:
  contents: read

jobs:
  prepare_linux:
    if: >-
      github.repository == 'yizhiteamo/Clytie' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false && github.run_attempt == 1
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PREPARATION_CANDIDATE: ${{ github.event.pull_request.head.sha }}
      PREPARATION_PUBLIC: .github/a43-preparation-public.json
      PREPARATION_ROOT: ${{ runner.temp }}/a43-preparation
      PREPARATION_SEALED: ${{ runner.temp }}/a43-preparation-sealed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      - name: Install existing locked development environment
        shell: bash
        run: |
          python -m pip install uv==0.9.5
          uv sync --locked
      - name: Validate explicit request and PRIVATE repository
        id: request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync python -m scripts.measurement_preparation_request
      - name: Generate approved fictional geometry and runtime metadata
        if: ${{ success() && steps.request.outputs.eligible == 'true' }}
        shell: bash
        run: >-
          uv run --no-sync python -m scripts.measurement_preparation_generate prepare
          --target "$PREPARATION_ROOT" --candidate "$PREPARATION_CANDIDATE"
      - name: Seal exact preparation files and recheck PRIVATE
        if: ${{ success() && steps.request.outputs.eligible == 'true' }}
        id: seal
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --no-sync python -m scripts.measurement_preparation_transport ci-seal
          --source "$PREPARATION_ROOT/raw" --target "$PREPARATION_SEALED"
          --public "$PREPARATION_PUBLIC" --expected "$PREPARATION_ROOT/expected.json"
          --version-directory "$PREPARATION_ROOT/product"
      - name: Upload preparation ciphertext pending local verification
        id: upload
        if: ${{ success() && steps.request.outputs.eligible == 'true' && steps.seal.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a43-preparation-encrypted-${{ github.run_id }}-${{ github.run_attempt }}-linux
          path: |
            ${{ steps.seal.outputs.ciphertext }}
            ${{ steps.seal.outputs.receipt }}
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: false

  prepare_windows:
    if: >-
      github.repository == 'yizhiteamo/Clytie' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false && github.run_attempt == 1
    runs-on: windows-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PREPARATION_CANDIDATE: ${{ github.event.pull_request.head.sha }}
      PREPARATION_PUBLIC: .github/a43-preparation-public.json
      PREPARATION_ROOT: ${{ runner.temp }}/a43-preparation
      PREPARATION_SEALED: ${{ runner.temp }}/a43-preparation-sealed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      - name: Install existing locked development environment
        shell: bash
        run: |
          python -m pip install uv==0.9.5
          uv sync --locked
      - name: Validate explicit request and PRIVATE repository
        id: request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync python -m scripts.measurement_preparation_request
      - name: Generate approved fictional geometry and runtime metadata
        if: ${{ success() && steps.request.outputs.eligible == 'true' }}
        shell: bash
        run: >-
          uv run --no-sync python -m scripts.measurement_preparation_generate prepare
          --target "$PREPARATION_ROOT" --candidate "$PREPARATION_CANDIDATE"
      - name: Seal exact preparation files and recheck PRIVATE
        if: ${{ success() && steps.request.outputs.eligible == 'true' }}
        id: seal
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --no-sync python -m scripts.measurement_preparation_transport ci-seal
          --source "$PREPARATION_ROOT/raw" --target "$PREPARATION_SEALED"
          --public "$PREPARATION_PUBLIC" --expected "$PREPARATION_ROOT/expected.json"
          --version-directory "$PREPARATION_ROOT/product"
      - name: Upload preparation ciphertext pending local verification
        id: upload
        if: ${{ success() && steps.request.outputs.eligible == 'true' && steps.seal.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a43-preparation-encrypted-${{ github.run_id }}-${{ github.run_attempt }}-windows
          path: |
            ${{ steps.seal.outputs.ciphertext }}
            ${{ steps.seal.outputs.receipt }}
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: false
