name: A4.3 encrypted pending evidence
description: Approved fictional evidence only; no plaintext fallback or local private key.
inputs:
  source:
    description: Exact directory containing the five fixed fictional measurement files
    required: true
  expected:
    description: Frozen run identity and method manifest
    required: true
  public:
    description: Dedicated public recipient record
    required: true
  evidence-id:
    description: Stable arm identifier from the frozen plan
    required: true
outputs:
  artifact-id:
    description: Ciphertext artifact; still pending local verification
    value: ${{ steps.upload.outputs.artifact-id }}
runs:
  using: composite
  steps:
    - name: Validate, encrypt and check repository visibility
      id: seal
      shell: bash
      env:
        EVIDENCE_SOURCE: ${{ inputs.source }}
        EVIDENCE_EXPECTED: ${{ inputs.expected }}
        EVIDENCE_PUBLIC: ${{ inputs.public }}
        EVIDENCE_ID: ${{ inputs.evidence-id }}
        GH_TOKEN: ${{ github.token }}
      run: uv run --no-sync python -m scripts.measurement_transport ci-seal
    - name: Upload ciphertext only
      id: upload
      if: ${{ success() && steps.seal.outcome == 'success' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: a43-encrypted-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.evidence-id }}
        path: |
          ${{ steps.seal.outputs.ciphertext }}
          ${{ steps.seal.outputs.receipt }}
        retention-days: 14
        if-no-files-found: error
        include-hidden-files: false
